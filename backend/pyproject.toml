[project]
name = "patriot-backend"
version = "0.1.0"
description = "PATRIOT-AD Policy Gateway, mesin deteksi 3 lapis, forensic hash-chain log, dan FastAPI/WebSocket bridge"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "pydantic>=2.7",
    "paho-mqtt>=2.1",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
