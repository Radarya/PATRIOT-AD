# ==============================================================================
# PATRIOT-AD MQTT Access Control List (ACL)
# Kartika Cyber Hackathon 2026 - PUSSIBERAD
# ==============================================================================

# User: patriot_gateway (Backend Policy Gateway)
# Gateway berhak membaca telemetri dan menulis perintah resmi yang telah diverifikasi
user patriot_gateway
topic read patriot/telemetry/+
topic write patriot/approved/cmd/+
topic readwrite patriot/request/cmd/+
topic readwrite patriot/status/#

# User: esp32_gudang (Mikrokontroler Fisik Pos Gudang)
# ESP32 HANYA berhak mengirim telemetri miliknya dan menerima perintah resmi
user esp32_gudang
topic write patriot/telemetry/esp32_gudang
topic read patriot/approved/cmd/esp32_gudang
